<header>
    <div class="icon-title" (click)="router.navigate(['/'])">
        <img class="icon" src="/static/img/icons/rabbit.svg" />
        <div class="title">Rabbit Hole</div>
    </div>
    @if (user$ | async; as user) {
        <div
            class="icon-title"
            (click)="router.navigate(user !== null ? ['/account'] : ['/login'])"
        >
            <img class="icon" src="/static/img/icons/profile.svg" />
            <div class="title">
                {{ user !== null ? user.username : "Login" }}
            </div>
        </div>
    }
</header>
